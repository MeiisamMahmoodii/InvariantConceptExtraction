<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="factor_sae_figure1_method-title factor_sae_figure1_method-desc" viewBox="0 0 1200 544">
<title id="factor_sae_figure1_method-title">Factor-contrastive sparse autoencoder</title>
<desc id="factor_sae_figure1_method-desc">Frozen activations enter a 9,216-feature dictionary split into intent and locale routes with separate BatchTopK activity budgets and reciprocal controlled losses.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="factor-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
  <marker id="factor-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
  <marker id="factor-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="1200" height="544" fill="#f5f5f5"/>
<text x="40" y="28" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', sans-serif" text-anchor="start" letter-spacing="1.2">METHOD</text><text x="40" y="64" fill="#2d3142" font-size="28" font-weight="400" font-family="'Instrument Serif', sans-serif" text-anchor="start" >A factor-contrastive sparse dictionary</text><text x="40" y="88" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start" >Controlled relations organize one overcomplete BatchTopK code.</text><path d="M200 252 H240" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#factor-arrow)"/><path d="M440 236 H468 Q476 236 476 228 V188 Q476 180 484 180 H512" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#factor-arrow-link)"/><path d="M440 284 H468 Q476 284 476 292 V356 Q476 364 484 364 H512" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#factor-arrow-accent)"/><path d="M712 180 H744 Q752 180 752 188 V228 Q752 236 760 236 H792" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#factor-arrow-link)"/><path d="M712 364 H744 Q752 364 752 356 V292 Q752 284 760 284 H792" fill="none" stroke="#eb6c36" stroke-width="2" marker-end="url(#factor-arrow-accent)"/><path d="M952 260 H992" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#factor-arrow)"/><path d="M1152 260 H1184" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#factor-arrow)"/><rect x="40" y="204" width="160" height="112" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/><text x="120" y="232" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', sans-serif" text-anchor="middle" letter-spacing="1">FROZEN INPUT</text><text x="120" y="264" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" >Gemma H</text><text x="120" y="288" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono', sans-serif" text-anchor="middle" >2,304 dimensions</text><rect x="240" y="204" width="200" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="340" y="232" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', sans-serif" text-anchor="middle" letter-spacing="1">SHARED ENCODER</text><text x="340" y="264" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" >Linear + ReLU</text><text x="340" y="288" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono', sans-serif" text-anchor="middle" >2,304 → 9,216</text><rect x="512" y="120" width="200" height="120" rx="8" fill="#e8edf7" stroke="#2e5aa8" stroke-width="2"/><text x="612" y="148" fill="#2e5aa8" font-size="8" font-weight="600" font-family="'Geist Mono', sans-serif" text-anchor="middle" letter-spacing="1">INTENT ROUTE</text><text x="612" y="180" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" >zC · 2,765 features</text><text x="612" y="204" fill="#2e5aa8" font-size="12" font-weight="400" font-family="'Geist Mono', sans-serif" text-anchor="middle" >BatchTopK budget B×13</text><text x="612" y="224" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist', sans-serif" text-anchor="middle" >same intent / different locale</text><rect x="512" y="304" width="200" height="120" rx="8" fill="#fcece5" stroke="#eb6c36" stroke-width="2"/><text x="612" y="332" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', sans-serif" text-anchor="middle" letter-spacing="1">LOCALE ROUTE</text><text x="612" y="364" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" >zS · 6,451 features</text><text x="612" y="388" fill="#eb6c36" font-size="12" font-weight="400" font-family="'Geist Mono', sans-serif" text-anchor="middle" >BatchTopK budget B×51</text><text x="612" y="408" fill="#4f5d75" font-size="8" font-weight="400" font-family="'Geist', sans-serif" text-anchor="middle" >same locale / different intent</text><rect x="792" y="204" width="160" height="112" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="872" y="232" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', sans-serif" text-anchor="middle" letter-spacing="1">SPARSE CODE</text><text x="872" y="264" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" >[zC ; zS]</text><text x="872" y="288" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist Mono', sans-serif" text-anchor="middle" >mean L0 = 64</text><rect x="992" y="204" width="160" height="112" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/><text x="1072" y="232" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', sans-serif" text-anchor="middle" letter-spacing="1">DECODER</text><text x="1072" y="264" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle" >Reconstruct H</text><text x="1072" y="288" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', sans-serif" text-anchor="middle" >ordinary SAE loss</text><text x="1168" y="232" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start" >Ĥ</text><rect x="280" y="468" width="640" height="48" rx="8" fill="#ffffff" stroke="#d8d9de" stroke-width="1"/><text x="304" y="496" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', sans-serif" text-anchor="start" letter-spacing="1">OBJECTIVE</text><text x="408" y="496" fill="#2d3142" font-size="12" font-weight="400" font-family="'Geist', sans-serif" text-anchor="start" >reconstruction + λ · reciprocal controlled contrast</text><text x="1136" y="496" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', sans-serif" text-anchor="end" >4× dictionary</text>
</svg>